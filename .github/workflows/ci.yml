name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noors
          POSTGRES_PASSWORD: noors
          POSTGRES_DB: noors
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noors -d noors"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://noors:noors@localhost:5432/noors?schema=public
      TEST_DATABASE_URL: postgresql://noors:noors@localhost:5432/noors_test?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @noors/api prisma:deploy
      - run: pnpm --filter @noors/api prisma:generate
      - run: pnpm --filter @noors/api db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Buying journey in a real browser against the production builds. Runs alongside `check`
  # (it does not wait for it) so a red build shows up from both sides at once.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noors
          POSTGRES_PASSWORD: noors
          POSTGRES_DB: noors
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noors -d noors"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://noors:noors@localhost:5432/noors?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @noors/api prisma:deploy
      - run: pnpm --filter @noors/api prisma:generate
      - run: pnpm --filter @noors/api db:seed
      - run: pnpm build
      - run: pnpm --filter @noors/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14
